[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reversibounty"
version = "0.1.0"
description = "Reversi (Othello): motor de juego, API para bots, bots de IA y torneo automático."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reversi Bounty" }]
keywords = ["reversi", "othello", "game", "ai", "minimax", "tournament", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
reversi-play = "reversibounty.terminal:main_texto"
reversi-play-color = "reversibounty.terminal:main_color"
reversi-tournament = "reversibounty.tournament:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reversibounty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# web/ para que los tests importen el puente (webglue.py), que no es parte del paquete.
pythonpath = ["web"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
