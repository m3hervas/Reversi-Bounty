<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><!-- Karoo: el pato supersónico, con casco, gafas y líneas de velocidad -->
<defs>
<radialGradient id="cielo" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#bfe9ff"/><stop offset=".6" stop-color="#55b6f0"/><stop offset="1" stop-color="#1f6fb8"/></radialGradient>
<radialGradient id="plumas" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#ffbe3b"/><stop offset="1" stop-color="#e08a12"/></radialGradient>
<linearGradient id="pico" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa45c"/><stop offset=".6" stop-color="#f26a1b"/><stop offset="1" stop-color="#c94a0c"/></linearGradient>
<linearGradient id="casco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4dde8"/></linearGradient>
<radialGradient id="lente" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e6f7ff"/><stop offset=".5" stop-color="#7fd0ff"/><stop offset="1" stop-color="#2a7fc4"/></radialGradient>
</defs>
<!-- el círculo de cielo que lo separa del fondo de la ficha -->
<circle cx="50" cy="50" r="41" fill="url(#cielo)" stroke="#2b1a0f" stroke-width="2.8"/>
<g stroke="#fff" stroke-linecap="round" opacity=".85">
<path d="M14 40 H30" stroke-width="3"/><path d="M11 50 H26" stroke-width="3.4"/><path d="M15 60 H28" stroke-width="3"/>
</g>
<g stroke="#2b1a0f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
<!-- cuello y cabeza -->
<path d="M58 72 C60 80 66 86 74 88 L80 80 C74 76 70 70 70 64 Z" fill="url(#plumas)"/>
<circle cx="60" cy="54" r="21" fill="url(#plumas)"/>
<!-- pico de pato, ancho y plano -->
<path d="M44 56 C34 52 22 54 19 60 C18 66 28 70 42 67 C46 66 48 61 44 56 Z" fill="url(#pico)"/>
<path d="M21 62 C28 64 36 64 44 61" fill="none" stroke-width="1.8"/>
<!-- casco de carreras -->
<path d="M40 46 C40 30 54 22 66 24 C78 26 84 38 81 50 C72 44 54 42 40 46 Z" fill="url(#casco)"/>
<path d="M60 23 C70 25 79 33 81 47" fill="none" stroke="#2d5fb8" stroke-width="7"/>
<path d="M60 23 C70 25 79 33 81 47" fill="none" stroke-width="2.6"/>
<path d="M48 37 L56 31 L60 38 Z" fill="#e2416b" stroke-width="1.8"/>
<!-- las gafas, subidas sobre el casco -->
<path d="M45 34 C52 30 64 29 74 33" fill="none" stroke="#6b3a1e" stroke-width="3"/>
<circle cx="52" cy="31" r="5.5" fill="url(#lente)"/><circle cx="66" cy="29" r="5.5" fill="url(#lente)"/>
<!-- correa del casco -->
<path d="M79 49 C80 58 76 66 70 68" fill="none" stroke="#7a4a1f" stroke-width="3"/>
<circle cx="79" cy="50" r="2.6" fill="#c9d3dd" stroke-width="1.6"/>
<!-- el ojo -->
<ellipse cx="57" cy="53" rx="6.6" ry="7.4" fill="#fff"/>
</g>
<circle cx="55.5" cy="53.5" r="3.4" fill="#15151c"/><circle cx="54.3" cy="52" r="1.2" fill="#fff"/>
<path d="M50 45.5 Q56 43 63 45" fill="none" stroke="#2b1a0f" stroke-width="2.2" stroke-linecap="round"/>
<!-- brillos -->
<ellipse cx="27" cy="57" rx="5" ry="1.8" fill="#fff" opacity=".55"/>
<circle cx="26" cy="60" r=".9" fill="#7a2c06"/><circle cx="30" cy="59.5" r=".9" fill="#7a2c06"/>
<path d="M45 40 Q50 33 58 32" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
<path d="M67 66 Q71 70 72 75" fill="none" stroke="#fff6c8" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
</svg>
